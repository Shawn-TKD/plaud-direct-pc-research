plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def noteProBootstrap = providers.gradleProperty('noteProBootstrap').map { it.toBoolean() }.getOrElse(false)
def bootstrapSn = providers.gradleProperty('bootstrapSn').getOrElse('').trim()
if (bootstrapSn && !(bootstrapSn ==~ /881[A-Za-z0-9_-]+/)) {
    throw new GradleException('bootstrapSn must be a Note Pro serial number starting with 881')
}

android {
    namespace 'com.plaud.template'
    compileSdk 34

    defaultConfig {
        applicationId noteProBootstrap ? "com.shawn.recorderhub.noteprobootstrap" : "com.shawn.recorderhub"
        manifestPlaceholders = [applicationLabel: noteProBootstrap ? "Note Pro 引导" : "@string/app_name"]
        minSdk 23
        targetSdk 34
        versionCode 22
        versionName "0.6.1"

        // User Access Token comes from local.properties (git-ignored), mirroring iOS
        // PartnerConfig.local.xcconfig — QA can swap tokens without editing source.
        //   local.properties:  PLAUD_USER_ACCESS_TOKEN=eyJhbGci...
        def localProps = new Properties()
        def localFile = rootProject.file('local.properties')
        if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
        def userAccessToken = localProps.getProperty('PLAUD_USER_ACCESS_TOKEN', '')
        // The one-time bootstrap accepts the short-lived JWT at runtime. Never embed it in an APK.
        buildConfigField 'String', 'USER_ACCESS_TOKEN', "\"${noteProBootstrap ? '' : userAccessToken}\""
        buildConfigField 'String', 'PLAUD_CLIENT_ID', "\"${localProps.getProperty('PLAUD_CLIENT_ID', '')}\""
        buildConfigField 'String', 'PLAUD_API_KEY', "\"${localProps.getProperty('PLAUD_API_KEY', '')}\""
        buildConfigField 'String', 'SILICONFLOW_API_KEY', "\"${localProps.getProperty('SILICONFLOW_API_KEY', '')}\""
        buildConfigField 'String', 'IDEASHELL_BEARER_TOKEN', "\"${localProps.getProperty('IDEASHELL_BEARER_TOKEN', '')}\""
        // Reverse-engineering probe: make cloud calls fail while replaying cached BLE auth.
        buildConfigField 'boolean', 'OFFLINE_REPLAY', noteProBootstrap ? 'false' : 'true'
        buildConfigField 'boolean', 'NOTE_PRO_BOOTSTRAP', noteProBootstrap ? 'true' : 'false'
        buildConfigField 'String', 'BOOTSTRAP_SN', "\"${noteProBootstrap ? bootstrapSn : ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // Signed with the debug keystore for internal QA distribution; supply a real
            // keystore via signingConfigs for store-facing builds.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Audio playback: robust Ogg/Opus support (OEM MediaPlayer often fails on it)
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    // Plaud SDK
    implementation files('libs/plaud-sdk.aar')

    // AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'

    // Material
    implementation 'com.google.android.material:material:1.10.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // SDK 传递依赖（SDK 通过 api 声明，app 需手动引入）
    implementation 'com.jakewharton.timber:timber:4.7.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'
    implementation 'com.github.tony19:logback-android:2.0.0'
    implementation 'org.slf4j:slf4j-api:1.7.32'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'org.java-websocket:Java-WebSocket:1.5.1'
    implementation 'com.google.guava:guava:28.2-android'
}
